<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mikepad</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <section class="window" aria-labelledby="title">
      <div class="titlebar">
        <img src="Mikepad.ico" alt="" width="24" height="24">
        <span>Mikepad</span>
      </div>
      <div class="menubar">
        <span>File</span>
        <span>Format</span>
        <span>Help</span>
      </div>
      <div class="content">
        <h1 id="title">Mikepad</h1>
        <p class="tagline">A dark sepia, Windows 98-inspired notepad for plain text files.</p>
        <div class="actions">
          <a class="button primary" href="https://github.com/mikert2010/Mikepad/releases/latest/download/Mikepad.zip">Download Mikepad</a>
          <a class="button" href="https://github.com/mikert2010/Mikepad">View source</a>
        </div>
        <p class="note">Windows may warn about apps downloaded from the internet until the project is code-signed.</p>
      </div>
      <div class="statusbar">Word Wrap On | Ready</div>
    </section>
  </main>
</body>
</html>
