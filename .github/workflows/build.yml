name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Mikepad
        shell: pwsh
        run: ./build.ps1

      - name: Package Mikepad
        shell: pwsh
        run: ./tools/New-ReleaseZip.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mikepad
          path: release/Mikepad.zip
